name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install socat (pty pairs for the RTU serial tests)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y socat
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start docker compose stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: "Smoke test: app -> simulator inside the compose network"
        run: python3 docker/smoke_test.py
      - name: "Smoke test: the workspace survives killing the app container"
        run: |
          python3 docker/smoke_test.py persist-write
          docker compose kill modbus-studio
          docker compose up -d --wait --wait-timeout 60
          python3 docker/smoke_test.py persist-check
      - name: "Smoke test: UI and published ports on the host"
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "<title>modbus-studio</title>"
          nc -z 127.0.0.1 5020 && nc -z 127.0.0.1 5021
      - name: "Smoke test: export to InfluxDB (compose profile influxdb)"
        run: |
          docker compose --profile influxdb up -d --wait --wait-timeout 180
          python3 docker/smoke_test.py influxdb
      - name: "Smoke test: publish over MQTT, read with mosquitto_sub (compose profile mqtt)"
        run: |
          docker compose --profile influxdb --profile mqtt up -d --wait --wait-timeout 180
          python3 docker/smoke_test.py mqtt
      - name: Stop stack (the simulator must exit on SIGTERM, not be killed)
        run: |
          docker compose stop --timeout 5
          docker compose ps -a --format '{{.Service}} {{.ExitCode}}'
          test "$(docker compose ps -a --format '{{.ExitCode}}' simulator)" = 0
      - if: failure()
        run: docker compose --profile influxdb --profile mqtt logs
      - if: always()
        run: docker compose --profile influxdb --profile mqtt down --volumes

  # sdist and wheel with the UI inside; the wheel installed and run on Linux, Windows
  # and macOS (what release.yml publishes to PyPI).
  package:
    needs: [backend, frontend]
    uses: ./.github/workflows/package.yml

  # The image for linux/amd64 and linux/arm64, each built and started on its own
  # architecture. Pushes to main that pass every job above become ghcr.io/...:edge
  # (and :sha-<commit>); versioned tags and :latest come from release.yml.
  image:
    needs: [backend, frontend, docker]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      tags: |
        type=edge,branch=main
        type=sha,prefix=sha-
